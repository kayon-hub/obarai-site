<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1F3A" />
  <title>ORBIT 登入｜新韻傳音</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --navy: #0B1F3A; --blue: #2563EB; --cyan: #06B6D4; --cream: #F8FAFC;
      --ink: #0F172A; --slate: #64748B; --line: #E2E8F0; --danger: #DC2626;
      --radius: 14px; --shadow: 0 10px 40px rgba(11, 31, 58, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      background: var(--cream); color: var(--ink); line-height: 1.55; min-height: 100dvh;
    }
    .hidden { display: none !important; }
    #screen-login {
      min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px;
      background: linear-gradient(165deg, #071525 0%, #0B1F3A 45%, #122A4A 100%);
    }
    .login-card {
      width: 100%; max-width: 400px; background: #fff; border-radius: 20px;
      padding: 28px 22px 22px; box-shadow: var(--shadow);
    }
    .login-logo { text-align: center; margin-bottom: 8px; }
    .login-logo .orbit { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.12em; color: var(--navy); }
    .login-logo .sub { font-size: 0.85rem; color: var(--slate); margin-top: 4px; }
    .login-card h1 { margin: 16px 0 6px; font-size: 1.25rem; text-align: center; }
    .login-card .hint { text-align: center; font-size: 0.85rem; color: var(--slate); margin: 0 0 18px; }
    .btn {
      border: none; border-radius: 12px; padding: 14px 12px; font-size: 0.95rem;
      font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn.google {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #fff; color: #1f1f1f; border: 1px solid #dadce0;
    }
    .btn.google:hover { background: #f8f9fa; }
    .btn.primary { width: 100%; background: var(--blue); color: #fff; }
    .btn.ghost { background: #F1F5F9; color: var(--ink); }
    .btn.secondary { background: var(--navy); color: #fff; width: 100%; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-err { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; margin: 12px 0; text-align: center; }
    .login-foot { margin-top: 14px; font-size: 0.75rem; color: var(--slate); text-align: center; line-height: 1.45; }
    .spin { width: 18px; height: 18px; border: 2px solid #e5e7eb; border-top-color: var(--blue);
      border-radius: 50%; animation: s 0.7s linear infinite; display: inline-block; vertical-align: middle; }
    @keyframes s { to { transform: rotate(360deg); } }

    #screen-app { max-width: 520px; margin: 0 auto; padding: 16px 16px 100px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .topbar .who { font-size: 0.9rem; color: var(--slate); }
    .topbar .who strong { color: var(--ink); }
    .topbar .logout { border: none; background: transparent; color: var(--blue); font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 8px; }
    .hero {
      background: linear-gradient(145deg, var(--navy) 0%, #15345c 100%);
      color: #fff; border-radius: 20px; padding: 20px 18px; box-shadow: var(--shadow); margin-bottom: 14px;
    }
    .hero .badge { font-size: 11px; letter-spacing: 0.08em; color: var(--cyan); font-weight: 700; margin-bottom: 8px; }
    .hero h1 { margin: 0 0 8px; font-size: 1.25rem; line-height: 1.35; }
    .hero p { margin: 0; color: #B8C5D6; font-size: 0.9rem; }
    .card { background: #fff; border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
    .card h2 { margin: 0 0 8px; font-size: 1.05rem; }
    .orbit-say {
      background: #EEF4FF; border-left: 4px solid var(--blue); border-radius: 0 12px 12px 0;
      padding: 12px 14px; font-size: 0.9rem; margin-bottom: 12px;
    }
    .orbit-say strong { color: var(--blue); }
    .feat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .feat { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: #FAFBFC; }
    .feat .k { font-size: 0.78rem; font-weight: 700; color: var(--blue); }
    .feat .v { font-size: 0.78rem; color: var(--slate); margin-top: 2px; }
    .q-block { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: #FAFBFC; }
    .q-block .q-num { font-size: 0.75rem; font-weight: 700; color: var(--blue); margin-bottom: 4px; }
    .q-block .q-text { font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
    textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
      font-size: 0.95rem; font-family: inherit; min-height: 72px; resize: vertical;
    }
    textarea:focus { outline: 2px solid rgba(37, 99, 235, 0.35); border-color: var(--blue); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 11px; font-size: 0.8rem; cursor: pointer; }
    .chip.on { background: #DBEAFE; border-color: var(--blue); color: var(--blue); font-weight: 600; }
    .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .summary-box {
      background: #F8FAFC; border: 1px dashed var(--line); border-radius: 12px; padding: 12px;
      font-size: 0.82rem; white-space: pre-wrap; max-height: 220px; overflow: auto; color: var(--slate);
    }
    .note { font-size: 0.75rem; color: var(--slate); margin-top: 8px; }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(12px);
      background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 0.85rem;
      opacity: 0; pointer-events: none; transition: 0.25s; z-index: 40;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 8px;
    }
    .blocked {
      background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B;
      border-radius: 12px; padding: 14px; font-size: 0.9rem; margin-top: 12px;
    }
  </style>
</head>

          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>

      </button>

      <div id="blockedBox" class="blocked hidden"></div>

  </div>

  <div id="screen-app" class="hidden">

     */
    
const XINYUN_CLIENT_ID = "a0985154502-pending-rny1ig";

    function matchProfileByName(name) {
      if (!name) return null;
      for (const h of NAME_HINTS) {
        if (h.re.test(String(name))) return USERS[h.id] || null;
      }
      return null;
    }

    /** 用 ORBIT 已綁定的員工／成員資料對身分（大家已綁定 Google 後應走這條） */
    async function resolveFromSystem(user) {
      const email = (user.email || "").toLowerCase();
      const uid = user.id;

      // 1) employees.user_id 已綁
      let { data: emp } = await supabase
        .from("employees")
        .select("id, name, email, role, position, department, client_id, user_id")
        .eq("user_id", uid)
        .maybeSingle();

      // 2) employees.email 對得上
      if (!emp && email) {
        const r = await supabase
          .from("employees")
          .select("id, name, email, role, position, department, client_id, user_id")
          .ilike("email", email)
          .maybeSingle();
        emp = r.data;
      }

      // 3) 新韻底下再找一次（防 email 大小寫／多租戶）
      if (!emp && email) {
        const r = await supabase
          .from("employees")
          .select("id, name, email, role, position, department, client_id, user_id")
          .eq("client_id", XINYUN_CLIENT_ID)
          .ilike("email", email)
          .maybeSingle();
        emp = r.data;
      }

      if (emp) {
        const byName = matchProfileByName(emp.name) || matchProfileByName(emp.position);
        if (byName) return { profile: byName, source: "employees", raw: emp };
        // 系統有員工列但名冊沒對上：仍給通用 staff 殼
        return {
          profile: {
            id: "dyn-" + (emp.id || uid),
            name: emp.name || email,
            call: (emp.name || "同仁").slice(0, 4),
            title: emp.position || emp.department || emp.role || "員工",
            kind: "staff",
            honor: "你",
            questions: [
              "你現在工作上，最花時間、最容易出錯、或最煩的是什麼事？",
              "如果我只能先幫你做掉一件事，你最希望是哪一件？",
              "我要怎麼配合你，你用我才輕鬆？（手機／電腦、什麼時間用、主動提醒還是自己查）",
              "打卡／請假你用過我了嗎？有沒有哪裡不順？",
              "還有什麼想跟我說的？"
            ]
          },
          source: "employees-generic",
          raw: emp
        };
      }

      // 4) client owner（新韻老闆帳）
      const { data: owned } = await supabase
        .from("clients")
        .select("id, name, user_id")
        .eq("user_id", uid)
        .maybeSingle();
      if (owned && owned.id === XINYUN_CLIENT_ID) {
        return { profile: USERS.xujunhao, source: "client-owner", raw: owned };
      }

      // 5) client_members 核准成員（至少確認是新韻的人）
      const { data: member } = await supabase
        .from("client_members")
        .select("client_id, role, approval_status, user_id")
        .eq("user_id", uid)
        .eq("client_id", XINYUN_CLIENT_ID)
        .maybeSingle();
      if (member && member.approval_status !== "pending") {
        // 成員有綁但 employees 沒對上 name → 用 email 後備
        const byEmail = EMAIL_MAP[email] ? USERS[EMAIL_MAP[email]] : null;
        if (byEmail) return { profile: byEmail, source: "client_members+email", raw: member };
        return {
          profile: {
            id: "member-" + uid.slice(0, 8),
            name: user.user_metadata?.full_name || user.user_metadata?.name || email,
            call: (user.user_metadata?.name || "同仁").toString().slice(0, 6),
            title: member.role || "成員",
            kind: "staff",
            honor: "你",
            questions: [
              "你現在工作上，最花時間、最容易出錯、或最煩的是什麼事？",
              "如果我只能先幫你做掉一件事，你最希望是哪一件？",
              "我要怎麼配合你，你用我才輕鬆？",
              "打卡／請假你用過我了嗎？有沒有哪裡不順？",
              "還有什麼想跟我說的？"
            ]
          },
          source: "client_members-generic",
          raw: member
        };
      }

      // 6) 純 email 後備
      if (EMAIL_MAP[email] && USERS[EMAIL_MAP[email]]) {
        return { profile: USERS[EMAIL_MAP[email]], source: "email-map", raw: null };
      }

      return null;
    }


    const USERS = {

        id: "wudengxiong", name: "吳登雄", call: "登雄", title: "業務（A車）", kind: "staff", honor: "你",

    let currentUser = null;

    function $(id) { return document.getElementById(id); }
    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1800);
    }
    function storageKey() {
      return "orbit-xinyun-portal-v3-" + (currentUser ? currentUser.id : "none");
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    async function loginWithGoogle() {
      $("loginErr").textContent = "";
      $("blockedBox").classList.add("hidden");
      $("btnGoogle").disabled = true;
      $("googleLabel").innerHTML = '<span class="spin"></span> 導向 Google…';
      const redirectTo = window.location.origin + window.location.pathname + window.location.search;
      const { error } = await supabase.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo,
          queryParams: { prompt: "select_account" }
        }
      });
      if (error) {
        $("loginErr").textContent = error.message || "Google 登入失敗";
        $("btnGoogle").disabled = false;
        $("googleLabel").textContent = "使用 Google 繼續";
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      currentUser = null;
      googleUser = null;
      $("screen-app").classList.add("hidden");
      $("screen-login").classList.remove("hidden");
      $("btnGoogle").disabled = false;
      $("googleLabel").textContent = "使用 Google 繼續";
      $("loginErr").textContent = "";
      $("blockedBox").classList.add("hidden");
      // clean hash from oauth
      if (location.hash) history.replaceState(null, "", location.pathname + location.search);

    function showBlocked(email) {

    // ===== staff =====

    function saveStaff() {
      const data = { answers: {}, extra: ($("extraNote") && $("extraNote").value) || "" };
      currentUser.questions.forEach((_, i) => {
        const el = $("q_"+i);
        if (el) data.answers[i] = el.value;
      });
      localStorage.setItem(storageKey(), JSON.stringify(data));
      if ($("summary")) $("summary").textContent = buildStaffSummary();
    }
    function loadStaff() {
      try {
        const data = JSON.parse(localStorage.getItem(storageKey()) || "null");
        if (!data) return;
        currentUser.questions.forEach((_, i) => {
          if ($("q_"+i) && data.answers && data.answers[i] != null) $("q_"+i).value = data.answers[i];
        });
        if ($("extraNote") && data.extra != null) $("extraNote").value = data.extra;
      } catch (_) {}
    }
    function buildStaffSummary() {
      const u = currentUser;
      const lines = ["【ORBIT × 新韻｜員工回饋】",
        "姓名：" + u.name + "（" + u.title + "）",
        "Google：" + (googleUser ? googleUser.email : ""),
        "時間：" + new Date().toLocaleString("zh-TW"), ""];
      u.questions.forEach((q, i) => {
        const a = ($("q_"+i) && $("q_"+i).value.trim()) || "（未填）";
        lines.push((i+1) + ". " + q);
        lines.push("→ " + a);
        lines.push("");

      lines.push("還想說：" + (($("extraNote") && $("extraNote").value.trim()) || "（未填）"));
      lines.push("", "— 由 ORBIT 整理 —");
      return lines.join("\n");
    }

    function renderChips(id, items) {
      const el = $(id);
      el.innerHTML = "";
      items.forEach(text => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip"; b.textContent = text;
        b.addEventListener("click", () => {
          b.classList.toggle("on");
          saveLeader();
          if ($("summary")) $("summary").textContent = buildLeaderSummary();
        });
        el.appendChild(b);
      });
    }
    function getOnChips(id) {
      const el = $(id); if (!el) return [];
      return [...el.querySelectorAll(".chip.on")].map(c => c.textContent);
    }
    function setOnChips(id, list) {
      const el = $(id); if (!el) return;
      el.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", (list||[]).includes(c.textContent)));
    }
    function val(id) { return $(id) ? $(id).value : ""; }
    function saveLeader() {
      localStorage.setItem(storageKey(), JSON.stringify({
        chipsH: getOnChips("historyChips"), chipsF: getOnChips("futureChips"),
        h_start: val("h_start"), h_turn: val("h_turn"), h_pride: val("h_pride"),
        f_vision: val("f_vision"), f_priority: val("f_priority"), f_boundary: val("f_boundary"),
        s_private: val("s_private")
      }));
    }
    function loadLeader() {
      try {
        const data = JSON.parse(localStorage.getItem(storageKey()) || "null");
        if (!data) return;
        ["h_start","h_turn","h_pride","f_vision","f_priority","f_boundary","s_private"].forEach(k => {
          if (data[k] != null && $(k)) $(k).value = data[k];
        });
        setOnChips("historyChips", data.chipsH || []);
        setOnChips("futureChips", data.chipsF || []);

    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); toast("已複製到剪貼簿"); }
      catch {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
        toast("已複製到剪貼簿");
      }
    }

        async function handleSession(session) {
      if (!session || !session.user) return false;
      const user = session.user;
      const email = (user.email || "").toLowerCase();
      const meta = user.user_metadata || {};
      googleUser = {
        email,
        name: meta.full_name || meta.name || email,
        avatar: meta.avatar_url || meta.picture || ""
      };

      // 營運帳號：選身分後進問題頁
      if (ADMIN_EMAILS.has(email)) {
        $("loginErr").textContent = "";
        $("blockedBox").classList.add("hidden");
        showAdminPicker();
        return true;
      }

      $("loginErr").textContent = "正在對照系統已綁定的員工資料…";
      let resolved = null;
      try {
        resolved = await resolveFromSystem(user);
      } catch (e) {
        console.warn("resolveFromSystem", e);
      }

      if (!resolved) {
        const uid = EMAIL_MAP[email];
        if (uid && USERS[uid]) resolved = { profile: USERS[uid], source: "email-map-fallback", raw: null };
      }

      if (!resolved || !resolved.profile) {
        showBlocked(email);
        return false;
      }

      currentUser = resolved.profile;
      console.info("[ORBIT portal] identity", resolved.source, currentUser.name, email);
      $("loginErr").textContent = "";
      enterApp();
      return true;
    }

      $("screen-login").classList.add("hidden");
      $("screen-app").classList.remove("hidden");
      $("whoName").textContent = googleUser.name || "KAYON";
      $("whoRole").textContent = "營運預覽";
      $("whoEmail").textContent = googleUser.email || "";
      if (googleUser.avatar) {
        $("whoAvatar").src = googleUser.avatar;
        $("whoAvatar").classList.remove("hidden");
      }
      $("heroTitle").textContent = "Hi，我是 ORBIT";
      $("heroSub").textContent = "你已用營運帳號登入。請選要預覽的身分，會帶出對應問題。";
      const list = Object.values(USERS).map(u => {
        return '<button type="button" class="btn ghost pick-role" data-id="' + u.id + '" style="width:100%;margin-bottom:8px;text-align:left">' +
          '<strong>' + escapeHtml(u.name) + '</strong> · ' + escapeHtml(u.title) + '</button>';
      }).join("");
      $("appBody").innerHTML =
        '<div class="card"><h2>選擇預覽身分</h2>' +
        '<p class="note" style="margin-bottom:12px">員工會用自己的 Google 直接進問題；你可在此切換預覽。</p>' +
        list + "</div>";
      document.querySelectorAll(".pick-role").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-id");
          currentUser = USERS[id];
          enterApp();
        });
      });
    }



    $("btnGoogle").addEventListener("click", loginWithGoogle);
    $("btnLogout").addEventListener("click", logout);

    // boot: recover session after OAuth redirect
    (async function boot() {
      // Supabase may put tokens in hash
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        await handleSession(session);
        // clean ugly hash from URL after parse
        if (location.hash && location.hash.includes("access_token")) {
          history.replaceState(null, "", location.pathname + location.search);
        }
      }
      supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === "SIGNED_IN" && session) {
          await handleSession(session);
        }
        if (event === "SIGNED_OUT") {
          currentUser = null;
          googleUser = null;
        }
      });
    })();
